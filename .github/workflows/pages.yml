name: Verify and publish the atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/test_source_pipeline.py
      - run: python tools/test_atlas_geometry.py
      - run: python tools/test_golden_gate.py
      - run: python tools/test_city_core.py
      - run: node tools/audit-assets.mjs
      - run: node tools/audit-atlas.mjs v3
      - run: node tools/audit-atlas.mjs
      - run: node --experimental-strip-types tools/audit-city-core.mjs
      - run: node --experimental-strip-types tools/audit-illustrated-expansion.mjs
      - run: node --experimental-strip-types tools/audit-full-bay.mjs
      - run: node --experimental-strip-types tools/audit-native-bay.mjs
      - run: npm run build
      - name: Size the Pages artifact for the current viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          archive = Path("dist/map")
          for name in ("v1", "v2", "v3", "v4", "v6", "v7", "v8"):
              path = archive / name
              if path.is_dir():
                  shutil.rmtree(path)
          byte_count = sum(path.stat().st_size for path in Path("dist").rglob("*") if path.is_file())
          if byte_count > 1_000_000_000:
              raise SystemExit(f"Pages artifact exceeds 1 GB: {byte_count:,} bytes")
          print(f"Pages artifact: {byte_count:,} bytes")
          PY
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
